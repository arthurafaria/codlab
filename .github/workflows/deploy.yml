name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais recente vence.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Publicar sem testar já deixou passar bug que alterava resposta de quem
      # tinha codificado. Falhou aqui, não publica.
      - name: Testes de integridade
        run: bun test

      - name: Gerar site estático
        run: bun run build
        env:
          # Pages de projeto servem em /<repo>. Sem isso, CSS e JS dão 404.
          NEXT_PUBLIC_BASE_PATH: /codlab

      # Sem isso o Jekyll do Pages ignora a pasta _next/ inteira.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
